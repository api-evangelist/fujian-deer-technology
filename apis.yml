aid: fujian-deer-technology
name: Fujian Deer Technology
description: 'Fujian Deer Technology (福建德尔科技股份有限公司) is a Chinese specialty-chemicals
  manufacturer founded in June 2014 and headquartered in the Jiaoyang Industrial Concentration
  Zone, Shanghang County, Longyan City, Fujian Province. The company pursues a full
  fluorine-chemistry industry-chain strategy, researching, producing and selling basic
  chemical materials, fluorine-containing electronic gases, high-purity semiconductor
  wet electronic chemicals, new-energy (lithium battery) materials and other fluorinated
  advanced materials. Its electronic-grade gases include trifluoromethane, carbon tetrafluoride,
  sulfur hexafluoride, hexafluoroethane, chlorine trifluoride and octafluorocyclobutane,
  supplied into semiconductor chips, LED chips, flat-panel displays, communications
  optical fibre, power and energy-storage batteries, ultra-high-voltage transmission
  and transformation, and photovoltaic power generation. It is a designated national
  high-tech enterprise and is privately held; its shares appear on secondary-market
  venues. It manufactures physical materials and publishes no public API, developer
  program or machine-readable interface.'
